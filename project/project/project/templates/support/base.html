{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'styles.css' %}">

    {% block extra_head %}{% endblock %}
    <title>{% block title %}Support Center{% endblock %}</title>
</head>

<body>
    <div class="container mt-5">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3">{% block header_title %}{% endblock %}</h1>
            <div>
                <a href="{% url 'planner:planner' %}" class="btn btn-outline-primary mr-2">Planner</a>
                <a href="{% url 'accounts:exit' %}" class="btn btn-outline-danger">Log Out</a>
            </div>
        </header>
        {% block content %}
        {% endblock %}
    </div>

    <!-- Optional JavaScript -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    {% block script %}{% endblock %}
</body>

</html>
